name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check version parity
        run: |
          node -e '
            const pkg = require("./package.json");
            const ext = require("./packages/vscode-extension/package.json");
            if (pkg.version !== ext.version) {
              throw new Error(`Version mismatch: root=${pkg.version} vs vsix=${ext.version}`);
            }
          '

      - name: Run Node & Swift tests
        run: npm run test:all

      - name: Build macOS release binary & package VSIX
        run: |
          npm run build:macos
          npm run package:vsix

  node-min-compat:
    runs-on: macos-15
    strategy:
      matrix:
        node-version: ['22.5.0', '22.14.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify daemon & CLI startup on Node ${{ matrix.node-version }}
        run: |
          TMP_STATE="$(mktemp -d)"
          trap 'rm -rf "$TMP_STATE"' EXIT
          node packages/daemon/bin/cli.mjs --version
          AI_TURN_METER_DB="$TMP_STATE/meter.db" AI_TURN_METER_STATE_DIR="$TMP_STATE" \
            node packages/daemon/bin/daemon.mjs --port=47987 --once
          AI_TURN_METER_DB="$TMP_STATE/meter.db" AI_TURN_METER_STATE_DIR="$TMP_STATE" \
            node packages/daemon/bin/cli.mjs receipt --json >/dev/null
          node -e 'Promise.all([import("./packages/daemon/src/adapters/codex.mjs"), import("./packages/daemon/src/quota.mjs")]).then(() => console.log("zstd-safe imports ok"))'
          SQLITE_FLAG=$(node -p 'Number(process.versions.node.split(".")[1]) < 13 ? "--experimental-sqlite" : ""')
          node $SQLITE_FLAG -e 'import("./packages/daemon/src/server.mjs").then(() => console.log("server import ok"))'
