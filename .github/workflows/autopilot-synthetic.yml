{
  "name": "One-shot approved bootstrap diagnostic (NOT PR or candidate validation)",
  "on": {
    "push": {
      "branches": [
        "docs/issue-autopilot-design-20261119"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "synthetic-only": {
      "if": "github.event_name == 'push' && github.repository_id == '1461122513' && github.actor == 'shadow-qw' && github.ref == 'refs/heads/docs/issue-autopilot-design-20261119' && vars.ATM_SYNTHETIC_APPROVED_WORKFLOW_SHA != '' && github.sha == vars.ATM_SYNTHETIC_APPROVED_WORKFLOW_SHA && github.workflow_sha == vars.ATM_SYNTHETIC_APPROVED_WORKFLOW_SHA && vars.ATM_SYNTHETIC_APPROVED_SOURCE_SHA == '87d3d39d40e63f18752443a6aee10e6797e75adb' && github.event.before == '465636b2f1bb92f65bcf2057b452d6d3bc580ab8' && github.event.after == github.sha && github.event.forced == false && github.event.deleted == false",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "concurrency": {
        "group": "approved-synthetic-bootstrap",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "name": "Gate one-shot approval",
          "env": {
            "APPROVED_WORKFLOW_SHA": "${{ vars.ATM_SYNTHETIC_APPROVED_WORKFLOW_SHA }}",
            "APPROVED_SOURCE_SHA": "${{ vars.ATM_SYNTHETIC_APPROVED_SOURCE_SHA }}"
          },
          "run": "set -eu\nnode --input-type=commonjs <<'NODE'\nconst assert=require('node:assert/strict'),fs=require('node:fs'),e=process.env;\nconst source=\"87d3d39d40e63f18752443a6aee10e6797e75adb\";\nassert.match(e.APPROVED_WORKFLOW_SHA??'',/^[a-f0-9]{40}$/);\nassert.equal(e.APPROVED_SOURCE_SHA,source);\nassert.equal(e.GITHUB_EVENT_NAME,'push');\nassert.equal(e.GITHUB_REPOSITORY,'shadow-qw/AI-Turn-Meter');\nassert.equal(e.GITHUB_REPOSITORY_ID,'1461122513');\nassert.equal(e.GITHUB_ACTOR,'shadow-qw');\nassert.equal(e.GITHUB_REF,\"refs/heads/docs/issue-autopilot-design-20261119\");\nassert.equal(e.GITHUB_SHA,e.APPROVED_WORKFLOW_SHA);\nassert.equal(e.GITHUB_WORKFLOW_SHA,e.APPROVED_WORKFLOW_SHA);\nconst event=JSON.parse(fs.readFileSync(e.GITHUB_EVENT_PATH,'utf8'));\nassert.equal(event.ref,e.GITHUB_REF);assert.equal(event.after,e.GITHUB_SHA);\nassert.equal(event.before,\"465636b2f1bb92f65bcf2057b452d6d3bc580ab8\");\nassert.equal(event.forced,false);assert.equal(event.deleted,false);\nassert.equal(event.repository.id,1461122513);assert.equal(event.repository.full_name,e.GITHUB_REPOSITORY);\nconsole.log(JSON.stringify({oneShotDiagnosticOnly:true,workflowSha:e.GITHUB_WORKFLOW_SHA,eventBefore:event.before,eventAfter:event.after,bootstrapSource:source}));\nNODE\n"
        },
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "shadow-qw/AI-Turn-Meter",
            "ref": "87d3d39d40e63f18752443a6aee10e6797e75adb",
            "path": "trusted-bootstrap",
            "sparse-checkout": "tools/autopilot/hosted-preflight",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24"
          }
        },
        {
          "name": "Verify fixed commit",
          "run": "set -eu\ntest \"$(git -C trusted-bootstrap rev-parse HEAD)\" = \"87d3d39d40e63f18752443a6aee10e6797e75adb\"\ngit -C trusted-bootstrap diff --exit-code\nuname -sm\nprintf 'ImageVersion=%s\\n' \"$ImageVersion\"\nnode --version\n/usr/bin/podman --version\n"
        },
        {
          "name": "Verify approved bootstrap bytes",
          "run": "set -eu\nnode --input-type=commonjs <<'NODE'\nconst fs=require('node:fs'),crypto=require('node:crypto'),assert=require('node:assert/strict'),path=require('node:path');\nconst expected={\n  \"tools/autopilot/hosted-preflight/contract.mjs\": \"ac65bd7acde1c1471a97ac1ac6c9c4138dcfff742b77a456aa57b589bb836433\",\n  \"tools/autopilot/hosted-preflight/host-probe.mjs\": \"214d04b23dbe92350f1e82abf4e18893522002fe374c5915c90fc842ba2d8a02\",\n  \"tools/autopilot/hosted-preflight/run-synthetic.mjs\": \"4a7619da39860dfb5c6f3df5bf5eca6db8c91d74e2e0d90fc843b079acf8ee75\",\n  \"tools/autopilot/hosted-preflight/harness.mjs\": \"df13509af0f39e5f2f4440a9e4a225c3450f04f5676b44cb27d34c747fd2c403\",\n  \"tools/autopilot/hosted-preflight/fixtures/baseline.mjs\": \"0f8480dbe21cfa51c0acc7c9e213a74fb0471fc73571d9806baff8e102ea8873\",\n  \"tools/autopilot/hosted-preflight/fixtures/cpu.mjs\": \"c2be86a353ddc000537b7000da19b2eea1009c187074d4f97226aa66a779ec2e\",\n  \"tools/autopilot/hosted-preflight/fixtures/pids.mjs\": \"47cf55cb7dcca77aa12c1b07c79c6619b006cff933ade077c4416467fdf2cec1\",\n  \"tools/autopilot/hosted-preflight/fixtures/memory.mjs\": \"eb3452b61450e1bbc27482c485f152d023d72c369a40b2477e8a601a92af1d72\",\n  \"tools/autopilot/hosted-preflight/fixtures/timeout.mjs\": \"30aa97ffd9be2bc7d336a12178cff6c44d37505fb164169e9e38df19b822961c\"\n};\nfor(const [name,digest] of Object.entries(expected)){\n const file=path.join('trusted-bootstrap',name),s=fs.lstatSync(file);\n assert.ok(s.isFile()&&!s.isSymbolicLink());\n assert.equal(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),digest,name);\n}\nconsole.log('APPROVED_BOOTSTRAP_BYTES_VERIFIED '+Object.keys(expected).length);\nNODE\n"
        },
        {
          "name": "Record exact PR metadata (data only; no checkout)",
          "run": "set -eu\nnode --input-type=module <<'NODE'\nimport assert from 'node:assert/strict';\nconst api='https://api.github.com/repos/shadow-qw/AI-Turn-Meter';\nconst sha=x=>{assert.match(x,/^[a-f0-9]{40}$/);return x;};\nconst reject=code=>Object.assign(new Error('metadata rejected'),{safeCode:code});\n// Response strings are untrusted even when hex/numeric-looking. Never log them.\n// Diagnostic labels are fixed source literals selected ONLY by the HTTP status.\nconst httpClass=status=>status===429?'rate-limit-status':status===401?'authentication-status':status===403?'forbidden-status':status>=500?'upstream-status':status>=300&&status<400?'redirect-status':'http-error-status';\nasync function get(route){\n assert.match(route,/^(\\/pulls\\/2|\\/git\\/commits\\/[a-f0-9]{40})$/);\n const token=process.env.ATM_METADATA_TOKEN;\n if(!token||!/^[-A-Za-z0-9_]+$/.test(token))throw reject('missing-token');\n const controller=new AbortController();let timer,reader;\n const work=async()=>{\n  const url=api+route;\n  const r=await fetch(url,{headers:{'User-Agent':'AI-Turn-Meter-bootstrap-audit','Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'},redirect:'error',signal:controller.signal,cache:'no-store'});\n  if(r.url&&r.url!==url)throw reject('response-url');\n  assert.ok(Number.isInteger(r.status)&&r.status>=100&&r.status<=599);\n  async function body(){\n   const limit=262144; // Success only; error bodies are never read.\n   const length=r.headers.get('content-length');\n   if(length&&(!/^\\d+$/.test(length)||Number(length)>limit))throw reject('body-limit');\n   if(!r.body)throw reject('empty-body');\n   reader=r.body.getReader();let size=0;const chunks=[];\n   while(true){const part=await reader.read();if(part.done)break;size+=part.value.byteLength;if(size>limit)throw reject('body-limit');chunks.push(Buffer.from(part.value));}\n   try{return JSON.parse(Buffer.concat(chunks).toString('utf8'));}catch{throw reject('invalid-json');}\n  }\n  if(!r.ok){\n   console.error('METADATA_HTTP '+JSON.stringify({status:r.status,classification:httpClass(r.status)}));\n   // Read zero error-body bytes: no message/header reflection, regardless of\n   // encoding, splitting or apparent numeric syntax. Finally cancels the stream.\n   if(r.body)reader=r.body.getReader();\n   throw reject('http-status');\n  }\n  return body();\n };\n try{return await Promise.race([work(),new Promise((_,no)=>{timer=setTimeout(()=>{controller.abort();no(reject('deadline'));},15000);})]);}\n finally{clearTimeout(timer);controller.abort();if(reader)reader.cancel().catch(()=>{});}\n}\nasync function main(){\n const p=await get('/pulls/2');assert.equal(p.state,'open');assert.equal(p.head.sha,process.env.GITHUB_SHA);\n assert.equal(p.head.repo.id,1461122513);assert.equal(p.base.repo.id,1461122513);\n assert.equal(p.base.sha,'759f3ea525b64281060b14ed43c6f35ae15705c8');\n const head=sha(p.head.sha),base=sha(p.base.sha),merge=sha(p.merge_commit_sha);\n const hc=await get('/git/commits/'+head),mc=await get('/git/commits/'+merge);\n assert.equal(hc.sha,head);assert.equal(mc.sha,merge);\n assert.deepEqual(mc.parents.map(x=>x.sha),[base,head]);\n sha(hc.tree.sha);sha(mc.tree.sha);\n // Even valid-looking response SHA strings can carry encoded data; retain the\n // validation, not their arbitrary values in logs. Head/base below are trusted\n // expected values already checked for equality, not free response strings.\n console.log(JSON.stringify({publicMetadataOnly:true,pr:2,head:process.env.GITHUB_SHA,base:'759f3ea525b64281060b14ed43c6f35ae15705c8',mergeValidated:true,headTreeValidated:true,mergeTreeValidated:true,driverSource:'87d3d39d40e63f18752443a6aee10e6797e75adb'}));\n}\ntry{await main();}catch(error){\n const codes=new Set(['missing-token','response-url','body-limit','empty-body','invalid-json','http-status','deadline']);\n console.error('METADATA_REJECTED '+(codes.has(error.safeCode)?error.safeCode:'validation-or-transport'));\n process.exitCode=1;\n}\nNODE\n",
          "env": {
            "ATM_METADATA_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Fixed approved synthetic driver only",
          "working-directory": "trusted-bootstrap",
          "run": "scratch=$(mktemp -d)\nenv -i PATH=\"$PATH\" HOME=\"$scratch\" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted node tools/autopilot/hosted-preflight/run-synthetic.mjs\n"
        }
      ]
    }
  }
}
