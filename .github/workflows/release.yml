name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The tarball's gzip bytes depend on Node's bundled zlib, so CI must build with the same
          # Node as the local `npm run release:tarball` that wrote the formula's sha256.
          node-version-file: '.nvmrc'

      - name: Verify tag matches package.json version
        run: |
          node -e '
            const pkg = require("./package.json");
            const ext = require("./packages/vscode-extension/package.json");
            const tagVer = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tagVer || ext.version !== tagVer) {
              throw new Error(`Tag v${tagVer} mismatch: pkg=${pkg.version}, ext=${ext.version}`);
            }
          '

      - name: Run test suite
        run: npm run test:all

      - name: Build release tarball & DMG
        run: |
          node scripts/build-release.mjs --verify-formula
          npm run release:dmg

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: shasum -a 256 *.dmg *.tar.gz *.vsix > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.vsix
            dist/SHA256SUMS.txt

      - name: Verify published release tarball matches Homebrew formula
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/build-release.mjs --sync-release --verify-only; then
              exit 0
            fi
            echo "Retry $attempt/5 waiting for GitHub Release asset..."
            sleep 3
          done
          exit 1
