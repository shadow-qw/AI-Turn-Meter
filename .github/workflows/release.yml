name: Release disabled pending independently reviewed Task E
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: No effect - all publication is hard disabled
        required: false
        type: string
      confirm_stable_tag:
        description: Reserved for future exact-object human approval; cannot unlock this workflow
        required: false
        type: string
permissions:
  contents: read
jobs:
  release-disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Publication hard stop - trusted provenance, immutable source and artifacts await Task E
        run: exit 1
